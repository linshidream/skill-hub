<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>表单 · OPC Prototype</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">OPC Demo</div>
        <a class="nav-link" href="./home.html">首页</a>
        <a class="nav-link" href="./detail.html">详情</a>
        <a class="nav-link active" href="./form.html">表单</a>
        <a class="nav-link" href="./empty.html">空态</a>
        <a class="nav-link" href="./error.html">异常</a>
      </aside>

      <main class="workspace">
        <section class="topbar">
          <div>
            <p class="eyebrow">创建与校验示意</p>
            <h1>新建业务对象</h1>
          </div>
          <a class="secondary-link" href="./detail.html">取消</a>
        </section>

        <form class="panel form-panel">
          <label>
            <span>名称 *</span>
            <input type="text" placeholder="请输入名称">
            <small class="field-error">校验示意：必填</small>
          </label>
          <label>
            <span>描述</span>
            <textarea rows="4" placeholder="补充说明"></textarea>
          </label>
          <div class="action-row">
            <a class="secondary-link" href="./error.html">模拟失败</a>
            <a class="primary-link" href="./home.html">提交</a>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
