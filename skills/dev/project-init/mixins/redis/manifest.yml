# redis mixin —— 可选数据源：redis（redisson 核心包，单机，手写 RedissonConfig）
# 条件加载：include.redis=y 时由 merge.py 装配（默认 y，--var include.redis=n 关闭）。
# 用 org.redisson:redisson 核心包（非 redisson-spring-boot-starter），无自动配置，
#   由本 mixin 提供 RedissonConfig.java（@Bean RedissonClient，单机 SingleServerConfig）。
# redisson 3.13.6：2026-08-08 查证 org/redisson/redisson maven-metadata，3.13.x 系列最大 GA，java8 兼容
#   （voucher-ledger 项目 java8/Boot2.7.18 实测全绿）。核心包不耦合 spring 版本（依赖 netty）。
#   已知限制：3.13.6 偏老（2020），java-mcp(java21) 启用后需运行冒烟，必要时升 3.2x+。
# 配置注入：redis.* 顶层块经 top-config 注入环境文件 @@TOP-EXTRA@@ 占位，值 ${REDIS_*:本地默认}。
name: redis
description: 可选数据源 redis（redisson 核心包 3.13.6，单机，手写 RedissonConfig）

variables:
  redisson.version: "3.13.6"   # 2026-08-08 查证：3.13.x 系列最大 GA，java8 兼容

pom:
  dependencyManagement:
    - {ref: "org.redisson:redisson", version: "{{redisson.version}}"}
  dependencies:
    - "org.redisson:redisson"

# 顶层配置块（注入环境文件 @@TOP-EXTRA@@ 占位，0 缩进——redis: 不属于 spring: 命名空间）
top-config:
  - "# redis 预留健康检查键初始化（一次性运维）：redis-cli -a \"$REDIS_PASSWORD\" SET health:check \"1\""
  - "redis:"
  - "  host: ${REDIS_HOST:127.0.0.1}"
  - "  port: ${REDIS_PORT:6379}"
  - "  password: ${REDIS_PASSWORD:zx123456}"
  - "  database: 0"

provides:
  files:
    - {from: files/RedissonConfig.java.tmpl, to: "{{core.module.name}}/src/main/java/{{package.path}}/config/RedissonConfig.java"}
    - {from: files/RedisHealthChecker.java.tmpl, to: "{{core.module.name}}/src/main/java/{{package.path}}/health/RedisHealthChecker.java"}
